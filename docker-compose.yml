services:
  db:
    image: postgres:16
    container_name: waytohome-db
    environment:
      POSTGRES_DB: ${DB_NAME:-waytohome}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - waytohome-data:/var/lib/postgresql/data
volumes:
  waytohome-data: